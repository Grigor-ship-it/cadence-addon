name: Daily DB Update

on:
  schedule:
    - cron: '0 6 * * *'   # 6am UTC daily (after backend aggregation runs)
  workflow_dispatch:       # allow manual trigger

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT so pushed tags trigger the Release workflow.
          # GITHUB_TOKEN cannot trigger downstream workflows (GitHub safeguard).
          token: ${{ secrets.RELEASE_PAT }}

      - name: Fetch latest Lua DB files from API
        run: |
          for region in us eu kr tw; do
            suffix=$([ "$region" = "us" ] && echo "" || echo "_$region")
            echo "Fetching RewardsDB${suffix}.lua..."
            curl -sf "https://api.cadencewow.com/api/v1/rewards/export?region=$region" \
              -o "RewardsDB${suffix}.lua" || echo "WARN: rewards $region failed"
          done

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated DB files
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "cadence-bot"
          git config user.email "bot@cadencewow.com"
          git add RewardsDB*.lua ScoresDB*.lua
          git commit -m "chore: daily DB update $(date -u +%Y-%m-%d)"

      - name: Auto-tag daily DB release
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Daily DB-only releases append a date suffix to the latest
          # SEMVER tag (major.minor.patch). This keeps real code releases
          # (v1.2.2, v1.2.3, …) cleanly separated from data refreshes
          # (v1.2.2.20260520, v1.2.2.20260521, …). When you cut a new
          # manual semver tag, daily releases automatically rebase onto
          # that new base.
          git fetch --tags
          BASE=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$BASE" ]; then
            BASE="v1.0.0"
          fi
          DATE=$(date -u +%Y%m%d)
          NEW_TAG="${BASE}.${DATE}"
          # If today's tag already exists (workflow re-run), bump with -N
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            N=2
            while git rev-parse "${NEW_TAG}.${N}" >/dev/null 2>&1; do
              N=$((N + 1))
            done
            NEW_TAG="${NEW_TAG}.${N}"
          fi
          echo "Tagging $NEW_TAG (base: $BASE)"
          git tag "$NEW_TAG"
          git push origin main "$NEW_TAG"
