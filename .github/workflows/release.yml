name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          cf-token: ${{ secrets.CF_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
